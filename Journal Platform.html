<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journal Platform</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.0.0/css/all.min.css">
    <style>
        body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin: 0;
    padding: 20px;
    color: #333;
    min-height: 90vh;
    overflow-x: hidden;
}

.pic {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    z-index: -1;
}

video {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

header {
    min-width: 200px;
    margin-top: 10px;
    text-align: center;
    padding: 40px 20px;
    background: rgba(177, 151, 53, 0.1);
    border-radius: 15px;
    margin-bottom: 20px;
    backdrop-filter: blur(5px);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    animation: headerSlideIn .5s ease-out;
    margin-left: 180px;
    margin-right: 180px;
    box-shadow: 0 0 5px rgb(255, 224, 87), 0 0 5px rgb(255, 224, 87), 0 0 5px rgb(11, 129, 48), 0 0 5px rgb(61, 136, 11);
}

header i {
    transition: all 0.5s ease;
    color: rgb(211, 211, 211);
    text-shadow: 0 0 2px grey, 0 0 2px grey, 0 0 2px grey;
}

header:hover i {
    color: white;
    text-shadow: 0 0 5px grey, 0 0 5px grey, 0 0 5px grey;
}

header h1 {
    color: white;
    margin: 0;
    font-size: 2.5em;
    transition: all 0.5s ease;
    animation: fadeInDown 1s ease-out 0s both;
    text-shadow: 0 0 2px grey, 0 0 2px grey, 0 0 2px grey;
}

header:hover h1 {
    color: black;
    text-shadow: 0 0 5px grey, 0 0 5px grey, 0 0 5px grey;
}

.tabs {
    display: flex;
    justify-content: center;
    margin: 20px 0;
    animation: fadeIn 1s ease-out .1s both;
}

.tab {
    padding: 10px 20px;
    background: rgba(50, 50, 50, 0.2);
    color: white;
    border: none;
    border-radius: 25px;
    margin: 0 5px;
    cursor: pointer;
    transition: all 0.4s ease;
    position: relative;
    overflow: hidden;
    text-shadow: 0 0 1px white, 0 0 1px white, 0 0 1px white;
}

.tab::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
    transition: left 0.5s ease;
}

.tab:hover::before {
    left: 100%;
}

.tab.active {
    color: black;
    text-shadow: 0 0 1px black, 0 0 1px black, 0 0 1px black;
    background: rgba(255, 255, 255, 0.4);
    transform: scale(1.05);
    box-shadow: 0 4px 10px black;
}

.search-bar,
.upload-form,
.story-list {
    display: block;
}

.hidden {
    display: none !important;
}

.search-bar {
    margin: 20px auto;
    max-width: 600px;
    text-align: center;
    animation: fadeIn 1s ease-out .1s both;
}

.search-container {
    position: relative;
    display: inline-block;
    width: 100%;
}

.search-bar input {
    width: 90%;
    padding: 15px 40px 15px 15px;
    font-size: 18px;
    border: none;
    border-radius: 25px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    transition: all 0.3s ease;
    background: rgba(255, 255, 255, 0.9);
}

.search-bar input:focus {
    outline: none;
    box-shadow: 0 4px 10px black;
    transform: scale(1.02);
    background: white;
}

.search-bar i {
    position: absolute;
    right: 25px;
    top: 50%;
    transform: translateY(-50%);
    color: #666;
    font-size: 18px;
    pointer-events: none;
}

.search-bar i:focus {
    outline: none;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    transform: scale(1.02);
    background: white;
}

.upload-form {
    max-width: 600px;
    margin-left: 27%;
    background: rgba(255, 255, 255, 0.95);
    padding: 50px;
    border-radius: 15px;
    animation: fadeIn .5s ease-out .1s both;
    position: relative;
    overflow: hidden;
    background: linear-gradient(to right, #f9f9f9 50%, #fff 50%);
    border: 3px solid #da6e21;
    box-shadow: 0 15px 20px black;
    height: 300px;
    background-image:
        radial-gradient(circle at 50% 50%, rgba(139, 69, 19, 0.1) 0%, transparent 50%),
        linear-gradient(to right, #f5f5dc 50%, #faf0e6 50%);
    background-size: 20px 20px, 100% 100%;
    background-repeat: repeat, no-repeat;
    border-radius: 20px;
    transform: perspective(1000px) rotateX(10deg) rotateX(10deg);
    transition: all 0.5s ease;
}

.upload-form:hover {
    transform: perspective(1000px) rotateY(0deg);
    box-shadow: none;
    border: 3px solid #8B4513;
}

.upload-form::before {
    content: '';
    position: absolute;
    top: 0;
    left: 50%;
    width: 6px;
    height: 100%;
    background: #8B4513;
    transform: translateX(-50%);
    z-index: 1;
    box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
    background-image: repeating-linear-gradient(90deg,
            #8B4513,
            #8B4513 2px,
            #654321 2px,
            #654321 4px);
}

.upload-form::after {
    content: '';
    position: absolute;
    top: 10px;
    left: 10px;
    width: 20px;
    height: 20px;
    background: #8B4513;
    border-radius: 50%;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
    z-index: 2;
}

.book {
    display: flex;
    position: relative;
    width: 100%;
    height: 100%;
}

.page {
    flex: 1;
    padding: 20px;
    background: transparent;
    position: relative;
    z-index: 2;
    background-image:
        radial-gradient(circle at 20% 80%, rgba(0, 0, 0, 0.05) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(0, 0, 0, 0.05) 0%, transparent 50%),
        radial-gradient(circle at 40% 40%, rgba(0, 0, 0, 0.05) 0%, transparent 50%);
    background-size: 100px 100px, 150px 150px, 200px 200px;
    background-repeat: no-repeat, no-repeat, no-repeat;
}

.page.left {
    border-right: 1px solid #ddd;
    border-radius: 10px 0 0 10px;
    background: linear-gradient(to bottom, #fafafa, #f0f0f0);
    background-image:
        linear-gradient(to bottom, #fafafa, #f0f0f0),
        radial-gradient(circle at 20% 80%, rgba(0, 0, 0, 0.05) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(0, 0, 0, 0.05) 0%, transparent 50%);
    transform: perspective(1000px) rotateY(-5deg);
}

.page.right {
    border-left: 1px solid #ddd;
    border-radius: 0 10px 10px 0;
    background: linear-gradient(to bottom, #fff, #f9f9f9);
    background-image:
        linear-gradient(to bottom, #fafafa, #f0f0f0),
        radial-gradient(circle at 20% 80%, rgba(0, 0, 0, 0.05) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(0, 0, 0, 0.05) 0%, transparent 50%);
    transform: perspective(1000px) rotateY(5deg);
}

.upload-form h2 {
    margin-top: 0;
    color: #fef247;
    position: relative;
    z-index: 1;
    text-align: left;
    font-size: 1.5em;
    text-shadow: 0 0 2px grey, 0 0 2px grey, 0 0 2px grey;
    animation: bounceIn 1s ease-out;
}

.upload-form input {
    width: 70%;
    margin-top: 50px;
    margin-bottom: 15px;
    padding: 12px 30px 12px 40px;
    border: 2px solid #ddd;
    border-radius: 8px;
    font-size: 16px;
    transition: all 0.3s ease;
    position: relative;
    z-index: 1;
    background: rgba(255, 255, 255, 0.8);
}

.upload-form input::placeholder {
    color: #999;
    font-style: italic;
}

.upload-form input:hover {
    border: 2px solid #fff1a8;
    box-shadow: 0 0 20px #fff0a7;
}

.upload-form textarea {
    width: 85%;
    margin-bottom: 6px;
    padding: 20px;
    border: 2px solid #ddd;
    border-radius: 8px;
    font-size: 16px;
    transition: all 0.3s ease;
    position: relative;
    z-index: 1;
    background: rgba(255, 255, 255, 0.8);
    resize: vertical;
    min-height: 120px;
}

.upload-form textarea:hover {
    border: 2px solid #fff1a8;
    box-shadow: 0 0 20px #fff0a7;
}

.upload-form textarea::placeholder {
    color: #999;
    font-style: italic;
}

.upload-form input:focus,
.upload-form textarea:focus {
    outline: none;
    border-color: #d9fa02;
    box-shadow: 0 0 15px #deff09;
    transform: translateY(-2px);
    background: white;
}

.upload-form button {
    padding: 10px 15px;
    background: linear-gradient(135deg, #f3bc45, #ffe65b);
    color: rgb(37, 37, 37);
    border: none;
    margin-left: 60%;
    border-radius: 10px;
    cursor: pointer;
    font-size: 10px;
    transition: all 0.3s ease;
    position: relative;
    z-index: 1;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.upload-form button::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
    transition: left 0.5s ease;
}

.upload-form button:hover::before {
    left: 100%;
}

.upload-form button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
}

.upload-form button:active {
    transform: scale(0.98);
}

.upload-form button i {
    margin-right: 8px;
}

.story-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
    margin-top: 30px;
}

.story-card {
    background: rgba(255, 255, 255, 0.95);
    padding: 20px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    cursor: pointer;
    transition: all 0.4s ease;
    animation: slideInUp 0.5s ease both;
    animation-delay: calc(var(--i) * 0.1s);
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg, #f5f5dc, #faf0e6);
    border: 2px solid #8B4513;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15), inset 0 0 15px rgba(139, 69, 19, 0.1);
    transform: perspective(1000px) rotateY(-2deg);
    background-image:
        radial-gradient(circle at 30% 70%, rgba(139, 69, 19, 0.05) 0%, transparent 50%),
        radial-gradient(circle at 70% 30%, rgba(139, 69, 19, 0.05) 0%, transparent 50%),
        linear-gradient(135deg, #f5f5dc, #faf0e6);
    background-size: 80px 80px, 120px 120px, 100% 100%;
    background-repeat: no-repeat, no-repeat, no-repeat;
    border-radius: 15px;
}

.story-card.new-upload {
    animation: slideInDown 0.5s ease;
}

.story-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
}

.story-card:hover::before {
    opacity: 1;
}

.story-card h3 {
    margin-top: 0;
    color: #667eea;
    transition: color 0.3s ease;
    font-family: 'Georgia', serif;
    font-size: 1.2em;
    text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
}

.story-card:hover h3 {
    color: #764ba2;
}

.story-card p {
    color: #666;
    transition: color 0.3s ease;
    line-height: 1.5;
    font-style: italic;
}

.story-card:hover p {
    color: #333;
}

.story-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    font-size: 0.9em;
    color: #888;
}

.story-date {
    font-weight: bold;
}

.story-word-count {
    background: rgba(102, 126, 234, 0.1);
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 0.8em;
    margin-left: 50%;
}

.story-card .story-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    font-size: 0.9em;
    color: #888;
}

.story-card .story-date {
    font-weight: bold;
}

.story-card .story-word-count {
    background: rgba(102, 126, 234, 0.1);
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 0.8em;
}

.story-actions {
    display: flex;
    justify-content: flex-end;
    margin-top: 10px;
}

.delete-btn {
    background: none;
    border: none;
    font-size: 18px;
    cursor: pointer;
    color: #ff0000;
    transition: all 0.3s ease;
    position: relative;
}

.delete-btn:hover {
    color: #cc0000;
    transform: scale(1.2) rotate(10deg);
}

.delete-btn:active {
    transform: scale(0.9);
}

.history-list {
    display: none;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
    margin-top: 20px;
}

.history-list.show {
    display: grid;
    animation: fadeIn 0.5s ease;
}

.history-card {
    background: rgba(255, 255, 255, 0.95);
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    position: relative;
    animation: slideInFromRight 0.5s ease both;
    transition: all 0.3s ease;
}

.history-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
}

.deleted-actions {
    display: flex;
    justify-content: space-between;
    margin-top: 10px;
}

.restore-btn,
.perm-delete-btn {
    padding: 8px 15px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
}

.restore-btn {
    background: #4CAF50;
    color: white;
}

.restore-btn:hover {
    background: #45a049;
    transform: translateY(-2px);
}

.restore-btn:active {
    transform: scale(0.95);
}

.perm-delete-btn {
    background: #f44336;
    color: white;
}

.perm-delete-btn:hover {
    background: #da190b;
    transform: translateY(-2px);
}

.perm-delete-btn:active {
    transform: scale(0.95);
}

.reader {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.8);
    justify-content: center;
    align-items: center;
    animation: fadeIn 0.3s ease;
    backdrop-filter: blur(5px);
}

.reader.show {
    display: flex;
}

.reader-content {
    background: white;
    padding: 30px;
    max-width: 800px;
    max-height: 80%;
    overflow-y: auto;
    border-radius: 15px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    animation: zoomIn 0.5s ease;
    transform: scale(0.8);
    transition: transform 0.3s ease;
}

.reader.show .reader-content {
    transform: scale(1);
}

.close {
    float: right;
    cursor: pointer;
    font-size: 24px;
    color: #333;
    transition: all 0.3s ease;
    margin-bottom: 10px;
}

.close:hover {
    color: rgb(255, 0, 0);
    transform: rotate(90deg);
}

.notification {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-100%);
    background: #4CAF50;
    color: white;
    padding: 15px 20px;
    border-radius: 8px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    animation: slideInFromTop 0.5s ease;
    z-index: 1000;
    opacity: 0;
    transition: all 0.3s ease;
}

.notification.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

.notification.hide {
    opacity: 0;
    transform: translateX(-50%) translateY(-100%);
}

@keyframes fadeIn {
    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}

@keyframes fadeInDown {
    from {
        opacity: 0;
        transform: translateY(-30px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes slideInUp {
    from {
        opacity: 0;
        transform: translateY(100%);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes slideInDown {
    from {
        opacity: 0;
        transform: translateY(-100%);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes slideInFromLeft {
    from {
        opacity: 0;
        transform: translateX(-50px);
    }

    to {
        opacity: 1;
        transform: translateX(0);
    }
}

@keyframes slideInFromRight {
    from {
        opacity: 0;
        transform: translateX(50px);
    }

    to {
        opacity: 1;
        transform: translateX(0);
    }
}

@keyframes slideInFromTop {
    from {
        opacity: 0;
        transform: translateX(-50%) translateY(-100%);
    }

    to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
    }
}

@keyframes headerSlideIn {
    from {
        opacity: 0;
        transform: translateY(-50px) scale(0.9);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@keyframes rotate {
    0% {
        transform: rotate(0deg);
    }

    100% {
        transform: rotate(360deg);
    }
}

@keyframes zoomIn {
    from {
        opacity: 0;
        transform: scale(0.5);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

@keyframes bounceIn {
    0% {
        opacity: 0;
        transform: scale(0.3);
    }

    50% {
        opacity: 1;
        transform: scale(1.05);
    }

    70% {
        transform: scale(0.9);
    }

    100% {
        opacity: 1;
        transform: scale(1);
    }
}
    </style>
</head>

<body>

    <div class="pic">
        <video autoplay muted loop>
            <source src="vid.mp4" type="video/mp4">
        </video>
    </div>
    <header>
        <h1> My Personal Journal Platform </h1>
    </header>

    <div class="tabs">
        <button class="tab" onclick="toggleUploadForm()" id="createBtn"><i class="fas fa-plus"></i></button>
        <button class="tab active" onclick="showTab('all')">All Journals</button>
        <button class="tab" onclick="showTab('deleted')">Recently Deleted</button>
    </div>

    <div class="search-bar" id="searchBar">
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search journals title..." onkeyup="filterStories()">
            <i class="fas fa-search"></i>
        </div>
    </div>
    <div class="upload-form hidden" id="uploadForm">
        <div class="book">
            <div class="page left">
                <h2><i class="fas fa-upload"></i> Upload a Journal</h2>
                <input type="text" id="title" placeholder="Enter Your Journal Title" required>
            </div>
            <div class="page right">
                <textarea id="content" placeholder="Enter Your Journal Content" rows="10" required></textarea>
                <button onclick="uploadStory()"><i class="fas fa-plus"></i> Upload</button>
            </div>
        </div>
    </div>

    <div class="story-list" id="storyList">
    </div>

    <div class="history-list" id="deletedList">
    </div>

    <div class="reader" id="reader">
        <div class="reader-content">
            <span class="close" onclick="closeReader()">&times;</span>
            <h2 id="readerTitle"></h2>
            <p id="readerContent"></p>
        </div>
    </div>

    <div class="notification" id="notification"></div>

    <script>
        let stories = JSON.parse(localStorage.getItem('stories')) || [];
        let deletedStories = JSON.parse(localStorage.getItem('deletedStories')) || [];

        function cleanDeletedStories() {
            const now = new Date();
            const thirtyDaysAgo = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);
            deletedStories = deletedStories.filter(story => {
                const storyDate = new Date(story.date);
                return storyDate > thirtyDaysAgo;
            });
            localStorage.setItem('deletedStories', JSON.stringify(deletedStories));
        }

        function renderStories(filteredStories = stories) {
            const list = document.getElementById('storyList');
            list.innerHTML = '';
            filteredStories.forEach((story, index) => {
                const card = document.createElement('div');
                card.className = 'story-card';
                card.style.setProperty('--i', index);
                const wordCount = story.content.split(' ').length;
                const date = new Date(story.date).toLocaleDateString();
                card.innerHTML = `
                    <div class="story-meta">
                        <span class="story-date">${date}</span>
                        <span class="story-word-count">${wordCount} words</span>
                    </div>
                    <h3><i class="fas fa-book"></i> ${story.title}</h3>
                    <p>${story.content.substring(0, 100)}...</p>
                    <div class="story-actions">
                        <button class="delete-btn" onclick="deleteStory(${index})"><i class="fas fa-trash"></i></button>
                    </div>
                `;
                card.onclick = (e) => {
                    if (!e.target.closest('.delete-btn')) openReader(story);
                };
                list.appendChild(card);
            });
        }

        function renderHistory() {
            cleanDeletedStories();
            const list = document.getElementById('deletedList');
            list.innerHTML = '';
            deletedStories.forEach((story, index) => {
                const card = document.createElement('div');
                card.className = 'history-card';
                const wordCount = story.content.split(' ').length;
                const date = new Date(story.date).toLocaleDateString();
                const now = new Date();
                const storyDate = new Date(story.date);
                const daysDiff = Math.floor((now - storyDate) / (1000 * 60 * 60 * 24));
                card.innerHTML = `
                    <div class="story-meta">
                        <span class="story-date">${date}</span>
                        <span class="story-word-count">${wordCount} words</span>
                    </div>
                    <h3><i class="fas fa-book"></i> ${story.title}</h3>
                    <p>${story.content.substring(0, 100)}...</p>
                    <div class="deleted-actions">
                        <button class="restore-btn" onclick="restoreStory(${index})"><i class="fas fa-undo"></i> Recover</button>
                        <button class="perm-delete-btn" onclick="permDeleteStory(${index})"><i class="fas fa-trash-alt"></i> Delete</button>
                    </div>
                `;
                card.onclick = (e) => {
                    if (!e.target.closest('.restore-btn') && !e.target.closest('.perm-delete-btn')) openReader(story);
                };
                list.appendChild(card);
            });
        }

        function deleteStory(index) {
            const story = stories.splice(index, 1)[0];
            deletedStories.push(story);
            localStorage.setItem('stories', JSON.stringify(stories));
            localStorage.setItem('deletedStories', JSON.stringify(deletedStories));
            renderStories();
            renderHistory();
            showNotification('Journal deleted successfully!');
        }

        function restoreStory(index) {
            const story = deletedStories.splice(index, 1)[0];
            stories.push(story);
            localStorage.setItem('stories', JSON.stringify(stories));
            localStorage.setItem('deletedStories', JSON.stringify(deletedStories));
            renderStories();
            renderHistory();
            showNotification('Journal recovered successfully!');
        }

        function permDeleteStory(index) {
            deletedStories.splice(index, 1);
            localStorage.setItem('deletedStories', JSON.stringify(deletedStories));
            renderHistory();
            showNotification('Journal deleted permanently!');
        }

        function showTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            const tabIndex = tab === 'all' ? 2 : tab === 'deleted' ? 3 : 1;
            document.querySelector(`.tab:nth-child(${tabIndex})`).classList.add('active');
            const storyList = document.getElementById('storyList');
            const searchBar = document.getElementById('searchBar');
            const uploadForm = document.getElementById('uploadForm');
            const deletedList = document.getElementById('deletedList');
            if (tab === 'deleted') {
                storyList.classList.add('hidden');
                searchBar.classList.add('hidden');
                uploadForm.classList.add('hidden');
                deletedList.classList.add('show');
                renderHistory();
            } else if (tab === 'create') {
                storyList.classList.add('hidden');
                searchBar.classList.add('hidden');
                uploadForm.classList.remove('hidden');
                deletedList.classList.remove('show');
            } else {
                storyList.classList.remove('hidden');
                searchBar.classList.remove('hidden');
                uploadForm.classList.add('hidden');
                deletedList.classList.remove('show');
                renderStories();
            }
        }

        function toggleUploadForm() {
            showTab('create');
        }

        function filterStories() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = stories.filter(story => story.title.toLowerCase().includes(query));
            renderStories(filtered);
        }

        function uploadStory() {
            const title = document.getElementById('title').value;
            const content = document.getElementById('content').value;
            if (title && content) {
                const date = new Date().toISOString();
                stories.push({ title, content, date });
                localStorage.setItem('stories', JSON.stringify(stories));
                renderStories();
                const storyList = document.getElementById('storyList');
                const lastCard = storyList.lastElementChild;
                if (lastCard) {
                    lastCard.classList.add('new-upload');
                }
                document.getElementById('title').value = '';
                document.getElementById('content').value = '';
                document.getElementById('searchInput').value = '';
                document.getElementById('uploadForm').classList.add('hidden');
                showTab('all');
                showNotification('Journal uploaded successfully!');
            }
        }

        function openReader(story) {
            document.getElementById('readerTitle').textContent = story.title;
            document.getElementById('readerContent').textContent = story.content;
            document.getElementById('reader').classList.add('show');
        }

        function closeReader() {
            document.getElementById('reader').classList.remove('show');
        }

        function showNotification(message) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.classList.add('show');
            setTimeout(() => {
                notification.classList.remove('show');
                notification.classList.add('hide');
                setTimeout(() => {
                    notification.classList.remove('hide');
                }, 300);
            }, 3000);
        }

        renderStories();
    </script>
</body>

</html>
