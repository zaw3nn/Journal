<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journal Platform</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.0.0/css/all.min.css">
    <link rel="stylesheet" href="Journal Platform.css">
</head>

<body>

    <div class="pic">
        <video autoplay muted loop>
            <source src="vid.mp4" type="video/mp4">
        </video>
    </div>
    <header>
        <h1> My Personal Journal Platform </h1>
    </header>

    <div class="tabs">
        <button class="tab" onclick="toggleUploadForm()" id="createBtn"><i class="fas fa-plus"></i></button>
        <button class="tab active" onclick="showTab('all')">All Journals</button>
        <button class="tab" onclick="showTab('deleted')">Recently Deleted</button>
    </div>

    <div class="search-bar" id="searchBar">
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search journals title..." onkeyup="filterStories()">
            <i class="fas fa-search"></i>
        </div>
    </div>
    <div class="upload-form hidden" id="uploadForm">
        <div class="book">
            <div class="page left">
                <h2><i class="fas fa-upload"></i> Upload a Journal</h2>
                <input type="text" id="title" placeholder="Enter Your Journal Title" required>
            </div>
            <div class="page right">
                <textarea id="content" placeholder="Enter Your Journal Content" rows="10" required></textarea>
                <button onclick="uploadStory()"><i class="fas fa-plus"></i> Upload</button>
            </div>
        </div>
    </div>

    <div class="story-list" id="storyList">
    </div>

    <div class="history-list" id="deletedList">
    </div>

    <div class="reader" id="reader">
        <div class="reader-content">
            <span class="close" onclick="closeReader()">&times;</span>
            <h2 id="readerTitle"></h2>
            <p id="readerContent"></p>
        </div>
    </div>

    <div class="notification" id="notification"></div>

    <script>
        let stories = JSON.parse(localStorage.getItem('stories')) || [];
        let deletedStories = JSON.parse(localStorage.getItem('deletedStories')) || [];

        function cleanDeletedStories() {
            const now = new Date();
            const thirtyDaysAgo = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);
            deletedStories = deletedStories.filter(story => {
                const storyDate = new Date(story.date);
                return storyDate > thirtyDaysAgo;
            });
            localStorage.setItem('deletedStories', JSON.stringify(deletedStories));
        }

        function renderStories(filteredStories = stories) {
            const list = document.getElementById('storyList');
            list.innerHTML = '';
            filteredStories.forEach((story, index) => {
                const card = document.createElement('div');
                card.className = 'story-card';
                card.style.setProperty('--i', index);
                const wordCount = story.content.split(' ').length;
                const date = new Date(story.date).toLocaleDateString();
                card.innerHTML = `
                    <div class="story-meta">
                        <span class="story-date">${date}</span>
                        <span class="story-word-count">${wordCount} words</span>
                    </div>
                    <h3><i class="fas fa-book"></i> ${story.title}</h3>
                    <p>${story.content.substring(0, 100)}...</p>
                    <div class="story-actions">
                        <button class="delete-btn" onclick="deleteStory(${index})"><i class="fas fa-trash"></i></button>
                    </div>
                `;
                card.onclick = (e) => {
                    if (!e.target.closest('.delete-btn')) openReader(story);
                };
                list.appendChild(card);
            });
        }

        function renderHistory() {
            cleanDeletedStories();
            const list = document.getElementById('deletedList');
            list.innerHTML = '';
            deletedStories.forEach((story, index) => {
                const card = document.createElement('div');
                card.className = 'history-card';
                const wordCount = story.content.split(' ').length;
                const date = new Date(story.date).toLocaleDateString();
                const now = new Date();
                const storyDate = new Date(story.date);
                const daysDiff = Math.floor((now - storyDate) / (1000 * 60 * 60 * 24));
                card.innerHTML = `
                    <div class="story-meta">
                        <span class="story-date">${date}</span>
                        <span class="story-word-count">${wordCount} words</span>
                    </div>
                    <h3><i class="fas fa-book"></i> ${story.title}</h3>
                    <p>${story.content.substring(0, 100)}...</p>
                    <div class="deleted-actions">
                        <button class="restore-btn" onclick="restoreStory(${index})"><i class="fas fa-undo"></i> Recover</button>
                        <button class="perm-delete-btn" onclick="permDeleteStory(${index})"><i class="fas fa-trash-alt"></i> Delete</button>
                    </div>
                `;
                card.onclick = (e) => {
                    if (!e.target.closest('.restore-btn') && !e.target.closest('.perm-delete-btn')) openReader(story);
                };
                list.appendChild(card);
            });
        }

        function deleteStory(index) {
            const story = stories.splice(index, 1)[0];
            deletedStories.push(story);
            localStorage.setItem('stories', JSON.stringify(stories));
            localStorage.setItem('deletedStories', JSON.stringify(deletedStories));
            renderStories();
            renderHistory();
            showNotification('Journal deleted successfully!');
        }

        function restoreStory(index) {
            const story = deletedStories.splice(index, 1)[0];
            stories.push(story);
            localStorage.setItem('stories', JSON.stringify(stories));
            localStorage.setItem('deletedStories', JSON.stringify(deletedStories));
            renderStories();
            renderHistory();
            showNotification('Journal recovered successfully!');
        }

        function permDeleteStory(index) {
            deletedStories.splice(index, 1);
            localStorage.setItem('deletedStories', JSON.stringify(deletedStories));
            renderHistory();
            showNotification('Journal deleted permanently!');
        }

        function showTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            const tabIndex = tab === 'all' ? 2 : tab === 'deleted' ? 3 : 1;
            document.querySelector(`.tab:nth-child(${tabIndex})`).classList.add('active');
            const storyList = document.getElementById('storyList');
            const searchBar = document.getElementById('searchBar');
            const uploadForm = document.getElementById('uploadForm');
            const deletedList = document.getElementById('deletedList');
            if (tab === 'deleted') {
                storyList.classList.add('hidden');
                searchBar.classList.add('hidden');
                uploadForm.classList.add('hidden');
                deletedList.classList.add('show');
                renderHistory();
            } else if (tab === 'create') {
                storyList.classList.add('hidden');
                searchBar.classList.add('hidden');
                uploadForm.classList.remove('hidden');
                deletedList.classList.remove('show');
            } else {
                storyList.classList.remove('hidden');
                searchBar.classList.remove('hidden');
                uploadForm.classList.add('hidden');
                deletedList.classList.remove('show');
                renderStories();
            }
        }

        function toggleUploadForm() {
            showTab('create');
        }

        function filterStories() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = stories.filter(story => story.title.toLowerCase().includes(query));
            renderStories(filtered);
        }

        function uploadStory() {
            const title = document.getElementById('title').value;
            const content = document.getElementById('content').value;
            if (title && content) {
                const date = new Date().toISOString();
                stories.push({ title, content, date });
                localStorage.setItem('stories', JSON.stringify(stories));
                renderStories();
                const storyList = document.getElementById('storyList');
                const lastCard = storyList.lastElementChild;
                if (lastCard) {
                    lastCard.classList.add('new-upload');
                }
                document.getElementById('title').value = '';
                document.getElementById('content').value = '';
                document.getElementById('searchInput').value = '';
                document.getElementById('uploadForm').classList.add('hidden');
                showTab('all');
                showNotification('Journal uploaded successfully!');
            }
        }

        function openReader(story) {
            document.getElementById('readerTitle').textContent = story.title;
            document.getElementById('readerContent').textContent = story.content;
            document.getElementById('reader').classList.add('show');
        }

        function closeReader() {
            document.getElementById('reader').classList.remove('show');
        }

        function showNotification(message) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.classList.add('show');
            setTimeout(() => {
                notification.classList.remove('show');
                notification.classList.add('hide');
                setTimeout(() => {
                    notification.classList.remove('hide');
                }, 300);
            }, 3000);
        }

        renderStories();
    </script>
</body>

</html>
